<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whack-a-Mole</title>
  <style>
    body{
        text-align: center;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      gap: 8px;
      justify-content: center;
    }
    .cell {
      height: 75px;
      font-size: 30px;
      cursor: pointer;
    }
    .active { background: lightgreen; }
  </style>
</head>
<body>
  <h2>Whack-a-Mole</h2>
  <p>Score: <span id="score">0</span></p>
  <p>Time: <span id="time">30</span>s</p>
  <button id="start">Start Game</button><br><br>
  <div id="grid"></div>
  <script src="whack-a-hole.js"></script>
</body>
</html>
