<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction Timer</title>
  <style>
    body { text-align: center; font-family: Arial; }
    #box {
      height: 200px;
      max-width: 400px;
      margin: 30px auto;
      background: red;
      display: grid;
      place-items: center;
      color: white;
      cursor: pointer;
      font-size: 22px;
    }
    #box.ready { background: green; }
  </style>
</head>
<body>
  <h2>Reaction Timer</h2>
  <p>Click when the box turns green!</p>
  <div id="box">Click Start</div>
  <button id="start">Start</button>
  <p id="result"></p>
  <p>Best: <span id="best">--</span> ms</p>
  <script src="reaction_timer.js"></script>
</body>
</html>
